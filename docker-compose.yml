services:
  pgserver:
    image: postgres:16
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - dbnet
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-Utilizador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      pgserver:
        condition: service_healthy
    networks:
      - dbnet
    ports:
      - 8080:8080
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgserver:5432/${POSTGRES_DB:-postgres}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-Utilizador}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - dbnet
    ports:
      - 8081:8080
    environment:
      - BACKEND_API_URL=http://backend:8080

volumes:
  postgres-data:

networks:
  dbnet:
    driver: bridge