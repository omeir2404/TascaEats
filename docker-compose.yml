services:
  pgserver:
    image: postgres:18.3-alpine3.23
#    container_name: pgserver # removed for docker-compose to manage container names
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - dbnet
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-Utilizador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  # APP*****************************************
  springbootapp:
    image: tascaeats-app:dev
    build:
      context: .
#    container_name: java_app # removed for docker-compose to manage container names
    restart: unless-stopped
    depends_on:
      pgserver:
        condition: service_healthy
    networks:
      - dbnet
    ports:
      - 8080:8080
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgserver:5432/${POSTGRES_DB:-postgres}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-Utilizador}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}

volumes:
  postgres-data:


networks:
  dbnet:
    driver: bridge
