services:
  pgserver:
    image: postgres:18.3-alpine3.23
#    container_name: pgserver # removed for docker-compose to manage container names
    volumes:
      - postgres-data:/var/lib/postgresql/
    expose:
      - 5432
    ports:
      - 5432:5432
    networks:
      - dbnet
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    restart: unless-stopped

  # APP*****************************************
  springbootapp:
    image: tascaeats-app:dev
    build:
      context: .
#    container_name: java_app # removed for docker-compose to manage container names
    restart: unless-stopped
    depends_on:
      - pgserver
    networks:
      - dbnet
    ports:
      - 8080:8080

volumes:
  postgres-data:


networks:
  dbnet:
    driver: bridge
