<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurantes - TascaEats</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: cabecalho}"></div>

    <main>
        <h2>Pesquisar Restaurantes</h2>
        
        <div class="filtro-container">
            <form th:action="@{/restaurantes/pesquisa}" method="GET">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Tasca do Zé">
                </div>
                
                <div class="form-group">
                    <label for="tipoCozinha">Tipo de Cozinha:</label>
                    <select id="tipoCozinha" name="tipoCozinha">
                        <option value="">Todos</option>
                        <option value="PORTUGUESA">Portuguesa</option>
                        <option value="ITALIANA">Italiana</option>
                        <option value="JAPONESA">Japonesa</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="estado">Horário:</label>
                    <select id="estado" name="estado">
                        <option value="">Qualquer</option>
                        <option value="ABERTO">Aberto</option>
                        <option value="FECHADO">Fechado</option>
                    </select>
                </div>

                <button type="submit">Pesquisar</button>
            </form>
        </div>

        <div class="grid-restaurantes">
            <div class="card" th:each="restaurante : ${restaurantes}">
                <h3 th:text="${restaurante.nome}">Nome do Restaurante</h3>
                <p><strong>Cozinha:</strong> <span th:text="${restaurante.tipoCozinha}">Tipo</span></p>
                <p><strong>Estado:</strong> <span th:text="${restaurante.estado}">Aberto</span></p>
                <p><strong>Avaliações:</strong> <span th:text="${restaurante.numeroAvaliacoes}">0</span></p>
                <br>
                <a th:href="@{/restaurantes/{id}(id=${restaurante.id})}">
                    <button>Ver Menu</button>
                </a>
            </div>
            
            <div th:if="${restaurantes == null or restaurantes.empty}">
                <p>Não foram encontrados restaurantes com esses filtros.</p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: rodape}"></div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
