events {
    worker_connections 1024;
}

http {
    # Upstream for the Monolith
    upstream monolith {
        server backend:8080;
    }

    # Upstream for the Web UI
    upstream web_ui {
        server web:8080;
    }

    # Upstream for the new Delivery Microservice
    upstream delivery_service {
        server delivery-backend:8080;
    }

    server {
        listen 80;
        listen [::]:80;
        
        # Support for gRPC (requires HTTP/2)
        listen 8080 http2; 

        server_name localhost;

        # 1. Route gRPC traffic to the monolith
        location /pt.ul.fc.css.tascaeats.grpc. {
            grpc_pass grpc://monolith;
            error_page 502 = /error502grpc;
        }

        # 2. Route Delivery-specific REST calls to the new Microservice
        # Keep API-compatible route used by other services
        location /api/entregas/ {
            proxy_pass http://delivery_service/api/entregas/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Also route public delivery endpoints used by the GUI (e.g. /entregas/pedido/...) to the delivery service
        location = /entregas {
            proxy_pass http://delivery_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /entregas/ {
            proxy_pass http://delivery_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Route REST API exact path `/pedidos` to the Monolith (API)
        location = /pedidos {
            proxy_pass http://monolith;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Serve Web UI pages under /pedidos/ (with trailing slash) from the Web UI
        location /pedidos/ {
            proxy_pass http://web_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /pagamentos {
            proxy_pass http://monolith;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /avaliacoes {
            proxy_pass http://monolith;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Route REST API calls to the Monolith
        location /api/ {
            proxy_pass http://monolith;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 5. Route all other traffic to the Web UI
        location / {
            proxy_pass http://web_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /error502grpc {
            internal;
            default_type application/grpc;
            add_header grpc-status 14;
            add_header grpc-message "unavailable";
            return 204;
        }
    }
}