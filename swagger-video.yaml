openapi: 3.0.1
info:
  title: TascaEats API
  description: API documentation for the TascaEats system
  version: "1.0"
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/restaurantes/{id}:
    get:
      tags:
      - restaurante-controller
      operationId: obterRestaurante
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
    put:
      tags:
      - restaurante-controller
      operationId: atualizarRestaurante
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarRestauranteDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/produtos/{id}:
    get:
      tags:
      - produto-controller
      operationId: obterProduto
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
    put:
      tags:
      - produto-controller
      operationId: atualizarProduto
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarProdutoDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
    delete:
      tags:
      - produto-controller
      operationId: apagarProduto
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/Utilizadors/{id}:
    get:
      tags:
      - utilizador-controller
      operationId: getUtilizadorById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
    put:
      tags:
      - utilizador-controller
      operationId: updateUtilizador
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilizadorUpdateDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
    delete:
      tags:
      - utilizador-controller
      operationId: deleteUtilizador
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /pedidos:
    get:
      tags:
      - pedido-controller
      operationId: listarPedidos
      parameters:
      - name: clienteId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: estado
        in: query
        required: false
        schema:
          type: string
          enum:
          - CRIADO
          - PAGO
          - A_PREPARAR
          - PRONTO_PARA_ENTREGA
          - CANCELADO
          - ATRIBUIDO_ENTREGADOR
          - ENTREGUE
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
    post:
      tags:
      - pedido-controller
      operationId: criarPedidoTexto_1
      requestBody:
        content:
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              $ref: '#/components/schemas/CriarPedidoDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /pagamentos:
    post:
      tags:
      - pagamento-controller
      operationId: pagarPedido
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessarPagamentoDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /entregas/atribuir:
    post:
      tags:
      - entrega-controller
      operationId: atribuirEntregador
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtribuirEntregadorDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/restaurantes:
    get:
      tags:
      - restaurante-controller
      operationId: listarRestaurantes
      parameters:
      - name: nome
        in: query
        required: false
        schema:
          type: string
      - name: cidade
        in: query
        required: false
        schema:
          type: string
      - name: estado
        in: query
        required: false
        schema:
          type: string
          enum:
          - ABERTO
          - FECHADO
          - RESERVADO
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: object
    post:
      tags:
      - restaurante-controller
      operationId: criarRestaurante
      parameters:
      - name: adminEmail
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarRestauranteDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/restaurantes/{restauranteId}/produtos:
    post:
      tags:
      - produto-controller
      operationId: criarProduto
      parameters:
      - name: restauranteId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarProdutoDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /api/register:
    post:
      tags:
      - utilizador-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilizadorRegistoDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/login:
    post:
      tags:
      - utilizador-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilizadorLoginDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiMessageDTO'
  /pedidos/{pedidoId}/cancelar:
    patch:
      tags:
      - pedido-controller
      operationId: cancelarPedido
      parameters:
      - name: pedidoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /entregas/pedido/{pedidoId}/recolha:
    patch:
      tags:
      - entrega-controller
      operationId: registarRecolha
      parameters:
      - name: pedidoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EntregaResumoDTO'
  /entregas/pedido/{pedidoId}/marcar-pronto:
    patch:
      tags:
      - entrega-controller
      operationId: marcarPedidoComoPronto
      parameters:
      - name: pedidoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /entregas/pedido/{pedidoId}/iniciar-preparacao:
    patch:
      tags:
      - entrega-controller
      operationId: iniciarPreparacao
      parameters:
      - name: pedidoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /entregas/pedido/{pedidoId}/entrega-final:
    patch:
      tags:
      - entrega-controller
      operationId: registarEntregaFinal
      parameters:
      - name: pedidoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EntregaResumoDTO'
  /api/restaurantes/{id}/fechar:
    patch:
      tags:
      - restaurante-controller
      operationId: fecharRestaurante
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/restaurantes/{id}/estado:
    patch:
      tags:
      - restaurante-controller
      operationId: atualizarEstado
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarEstadoRestauranteDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/restaurantes/{id}/abrir:
    patch:
      tags:
      - restaurante-controller
      operationId: abrirRestaurante
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/produtos/{id}/disponibilidade:
    patch:
      tags:
      - produto-controller
      operationId: atualizarDisponibilidade
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarDisponibilidadeProdutoDTO'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/produtos:
    get:
      tags:
      - produto-controller
      operationId: listarProdutos
      parameters:
      - name: nome
        in: query
        required: false
        schema:
          type: string
      - name: restauranteId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: ativos
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: disponiveis
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: object
  /api/Utilizadors:
    get:
      tags:
      - utilizador-controller
      operationId: getUtilizadors
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UtilizadorRespostaDTO'
components:
  schemas:
    AtualizarRestauranteDTO:
      required:
      - morada
      - nif
      - nome
      type: object
      properties:
        nome:
          type: string
        nif:
          type: string
        morada:
          $ref: '#/components/schemas/MoradaDTO'
    MoradaDTO:
      required:
      - cidade
      - codigoPostal
      - distrito
      - numero
      - pais
      - rua
      type: object
      properties:
        rua:
          type: string
        numero:
          type: integer
          format: int32
        complemento:
          type: string
        codigoPostal:
          type: string
        cidade:
          type: string
        distrito:
          type: string
        pais:
          type: string
    AtualizarProdutoDTO:
      required:
      - descricao
      - id
      - nome
      - preco
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        preco:
          type: number
          format: double
        descricao:
          type: string
    UtilizadorUpdateDTO:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        type:
          type: string
        address:
          $ref: '#/components/schemas/MoradaDTO'
        available:
          type: boolean
    CriarPedidoDTO:
      required:
      - clienteId
      - produtosIds
      - restauranteId
      type: object
      properties:
        restauranteId:
          type: integer
          format: int64
        produtosIds:
          type: array
          items:
            type: integer
            format: int64
        clienteId:
          type: integer
          format: int64
    ProcessarPagamentoDTO:
      required:
      - detalhes
      - pedidoId
      - tipoPagamento
      type: object
      properties:
        pedidoId:
          type: integer
          format: int64
        tipoPagamento:
          type: string
        detalhes:
          type: object
          additionalProperties:
            type: object
    AtribuirEntregadorDTO:
      required:
      - pedidoId
      type: object
      properties:
        pedidoId:
          type: integer
          format: int64
    CriarRestauranteDTO:
      required:
      - morada
      - nif
      - nome
      type: object
      properties:
        nome:
          type: string
        nif:
          type: string
        morada:
          $ref: '#/components/schemas/MoradaDTO'
    CriarProdutoDTO:
      required:
      - descricao
      - nome
      - preco
      type: object
      properties:
        nome:
          type: string
        preco:
          type: number
          format: double
        descricao:
          type: string
    UtilizadorRegistoDTO:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        type:
          type: string
        address:
          $ref: '#/components/schemas/MoradaDTO'
    UtilizadorLoginDTO:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    ApiMessageDTO:
      type: object
      properties:
        message:
          type: string
    EntregaResumoDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        horaRecolha:
          type: string
          format: date-time
        horaEntrega:
          type: string
          format: date-time
        entregadorNome:
          type: string
    AtualizarEstadoRestauranteDTO:
      required:
      - estado
      type: object
      properties:
        estado:
          type: string
          enum:
          - ABERTO
          - FECHADO
          - RESERVADO
    AtualizarDisponibilidadeProdutoDTO:
      required:
      - disponivel
      type: object
      properties:
        disponivel:
          type: boolean
    LocalTime:
      type: object
      properties:
        hour:
          type: integer
          format: int32
        minute:
          type: integer
          format: int32
        second:
          type: integer
          format: int32
        nano:
          type: integer
          format: int32
    Pagamento:
      type: object
      properties:
        id:
          type: integer
          format: int64
        valor:
          type: number
          format: double
        dataPagamento:
          type: string
          format: date
        referenciaPagamento:
          type: string
    Pedido:
      type: object
      properties:
        id:
          type: integer
          format: int64
        data:
          type: string
          format: date
        hora:
          $ref: '#/components/schemas/LocalTime'
        valorTotal:
          type: number
          format: double
        estado:
          type: string
          enum:
          - CRIADO
          - PAGO
          - A_PREPARAR
          - PRONTO_PARA_ENTREGA
          - CANCELADO
          - ATRIBUIDO_ENTREGADOR
          - ENTREGUE
        getclienteId:
          type: integer
          format: int64
        restauranteId:
          type: integer
          format: int64
        produtosIds:
          type: array
          items:
            type: integer
            format: int64
        pagamento:
          $ref: '#/components/schemas/Pagamento'
    MoradaResponseDTO:
      type: object
      properties:
        rua:
          type: string
        numero:
          type: integer
          format: int32
        complemento:
          type: string
        pais:
          type: string
        distrito:
          type: string
        cidade:
          type: string
        codigoPostal:
          type: string
    UtilizadorRespostaDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        type:
          type: string
        available:
          type: boolean
        address:
          $ref: '#/components/schemas/MoradaResponseDTO'
