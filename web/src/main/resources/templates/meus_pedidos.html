<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - TascaEats</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: cabecalho}"></div>

    <main class="page-shell">
        <section class="split-intro">
            <div class="page-intro">
                <span class="section-eyebrow">Pedidos</span>
                <h2>Histórico de pedidos</h2>
            </div>
            <aside class="intro-aside">
                <strong>Acompanhamento</strong>
                <p>Consulta restaurante, data, total e estado antes de abrir o detalhe.</p>
            </aside>
        </section>

        <section class="orders-list">
            <div th:if="${pedidos == null or pedidos.empty}" class="empty-state">
                <p>Ainda nao existem pedidos no historico.</p>
                <div class="stack-actions" style="justify-content: center; margin-top: 16px;">
                    <a th:href="@{/restaurantes}"><button>Procurar restaurantes</button></a>
                </div>
            </div>

            <article class="order-card" th:each="pedido : ${pedidos}">
                <div>
                    <div class="pill-row">
                        <span th:class="'status-pill ' +
                            (${pedido.estado == 'PENDING'} ? 'status-pending' :
                            (${pedido.estado == 'DELIVERED'} ? 'status-delivered' : 'status-cancelled'))"
                            th:text="${pedido.estado}">STATUS</span>
                    </div>

                    <h3 style="margin-top: 12px;" th:text="${pedido.restauranteNome}">Restaurant Name</h3>

                    <div class="order-meta">
                        <span class="pill"><strong>Data:</strong>&nbsp;<span th:text="${pedido.data}">Date</span></span>
                        <span class="tag"><strong>Total:</strong>&nbsp;<span th:text="${pedido.total} + ' €'">0.00 €</span></span>
                    </div>

                    <div class="order-review" th:if="${pedido.avaliacao != null}" style="margin-top:8px;">
                        <strong>Avaliação:</strong>
                        <span th:text="${pedido.avaliacao.classificacao} + ' / 5'">5 / 5</span>
                        <p th:if="${pedido.avaliacao.comentario != null and pedido.avaliacao.comentario != ''}" th:text="${pedido.avaliacao.comentario}" style="margin:6px 0 0 0;">Comentário</p>
                    </div>
                </div>

                <div>
                    <a th:href="@{/pedidos/{id}(id=${pedido.id})}">
                        <button>Ver detalhes</button>
                    </a>
                </div>
            </article>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: rodape}"></div>
</body>
</html>
