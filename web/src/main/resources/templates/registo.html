<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - TascaEats</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-container { max-width: 400px; margin: 50px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .auth-container input, .auth-container select { width: 100%; padding: 10px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .auth-container button { width: 100%; padding: 12px; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: cabecalho}"></div>

    <main>
        <div class="auth-container">
            <h2 style="text-align: center;">Create Account</h2>

            <form th:action="@{/registo}" method="POST">
                <label for="nome">Full Name</label>
                <input type="text" id="nome" name="nome" required placeholder="Ex: Tiago Silva">

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Ex: tiago@email.com">

                <label for="papel">Account Type</label>
                <select id="papel" name="papel" required>
                    <option value="CLIENT">Client (Order Food)</option>
                    <option value="COURIER">Courier (Deliver Food)</option>
                    <option value="ADMIN">Administrator</option>
                </select>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Register</button>
            </form>
            
            <p style="text-align: center; margin-top: 20px;">
                Already have an account? <a th:href="@{/login}" style="color: #ff6600;">Log in</a>
            </p>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: rodape}"></div>
</body>
</html>
