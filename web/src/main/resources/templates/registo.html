<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo - TascaEats</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-login-compact">
    <div th:replace="~{fragments/header :: cabecalho}"></div>

    <main class="page-shell">
        <section class="auth-layout">
            <div class="auth-card">
                <div class="auth-card__media auth-card__media--signup" aria-hidden="true"></div>
                <div class="page-intro">
                    <span class="section-eyebrow">Criar conta</span>
                    <h2 style="font-size: 2rem;">Nova conta</h2>
                </div>
                <div th:if="${error != null}" class="error-message" th:text="${error}"></div>

                <form th:action="@{/registo}" method="POST">
                    <div class="auth-form-field">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" required placeholder="Ex: Tiago Silva">
                    </div>

                    <div class="auth-form-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="Ex: tiago@email.com">
                    </div>

                    <div class="auth-form-field">
                        <label for="papel">Tipo de conta</label>
                        <select id="papel" name="papel" required>
                            <option value="CLIENT">Cliente</option>
                            <option value="COURIER">Entregador</option>
                            <option value="ADMIN">Administrador</option>
                        </select>
                    </div>

                    <div class="auth-form-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Define uma password">
                    </div>

                    <div id="clientAddressFields">
                        <div class="auth-form-field">
                            <label for="rua">Morada (opcional) - Rua</label>
                            <input type="text" id="rua" name="rua" placeholder="Ex: Rua do Sol">
                        </div>

                        <div class="auth-form-field">
                            <label for="numero">Número</label>
                            <input type="number" id="numero" name="numero" min="1" placeholder="Ex: 10">
                        </div>

                        <div class="auth-form-field">
                            <label for="complemento">Andar (opcional)</label>
                            <input type="text" id="complemento" name="complemento" placeholder="Ex: 2o Esq">
                        </div>

                        <div class="auth-form-field">
                            <label for="codigoPostal">Código Postal</label>
                            <input type="text" id="codigoPostal" name="codigoPostal" placeholder="Ex: 1000-001">
                        </div>

                        <div class="auth-form-field">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" name="cidade" placeholder="Ex: Lisboa">
                        </div>

                        <div class="auth-form-field">
                            <label for="distrito">Distrito</label>
                            <input type="text" id="distrito" name="distrito" placeholder="Ex: Lisboa">
                        </div>

                        <div class="auth-form-field">
                            <label for="pais">País</label>
                            <input type="text" id="pais" name="pais" placeholder="Ex: Portugal">
                        </div>
                    </div>

                    <button type="submit">Criar conta</button>
                </form>

                <p class="auth-card__footer">
                    Já tens conta? <a th:href="@{/login}" class="search-link">Entrar</a>
                </p>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: rodape}"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const papelSelect = document.getElementById("papel");
            const addressContainer = document.getElementById("clientAddressFields");

            function toggleAddressFields() {
                const isClient = papelSelect.value === "CLIENT";
                addressContainer.style.display = isClient ? "block" : "none";

                addressContainer.querySelectorAll("input").forEach(function(input) {
                    if (!isClient) {
                        input.value = "";
                    }
                    input.required = false;
                });
            }

            papelSelect.addEventListener("change", toggleAddressFields);
            toggleAddressFields();
        });
    </script>
</body>
</html>
