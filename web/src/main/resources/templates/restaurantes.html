<main>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 10%;">
        <h1 style="color: #1a73e8; font-weight: 800;">Our Meals</h1>
        <div class="search-container">
            <input type="text" placeholder="search by name" style="padding: 8px 15px; border-radius: 20px; border: 1px solid #ddd;">
        </div>
    </div>

    <div class="category-bar">
        <div class="category-item active"><span>All</span></div>
        <div class="category-item"><span>Rice</span></div>
        <div class="category-item"><span>Burger</span></div>
        <div class="category-item"><span>Pizza</span></div>
        <div class="category-item"><span>Noodle</span></div>
        <div class="category-item"><span>Drink</span></div>
    </div>

    <div class="grid-meals">
        <div class="meal-card" th:each="produto : ${produtos}">
            <img th:src="${produto.imagemUrl != null ? produto.imagemUrl : 'https://via.placeholder.com/400x300'}" class="meal-img">

            <div class="meal-info">
                <span class="fav-icon">♥</span>
                <h4 th:text="${produto.nome}">Spaghetti Bolognese</h4>

                <div class="rating">
                    ★★★★★ <span style="color: #ccc; font-size: 10px;">156 Comments</span>
                </div>

                <div class="location">
                    📍 <span th:text="${produto.restaurante.cidade}">Jakarta, Indonesia</span>
                </div>

                <div class="price">
                    $ <span th:text="${produto.preco}">4.99</span>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-view-more">View More</button>
</main>
