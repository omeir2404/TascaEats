<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurantes - TascaEats</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: cabecalho}"></div>

    <main class="page-shell page-shell--restaurants">
        <section class="hero-strip">
            <div class="hero-strip__inner">
                <div class="search-card">
                    <div th:replace="~{fragments/search-bar :: live-search}"></div>
                </div>
            </div>
        </section>

        <section class="catalog-wrap">
        <div id="liveGridContainer" style="display: none;">
            <div class="section-header">
                <div>
                    <h3>Resultados da pesquisa</h3>
                </div>
            </div>
            <div id="liveGridResults" class="grid-restaurantes"></div>
        </div>

        <div id="defaultViews">
            <section class="section-stack">
                <div class="surface-panel surface-panel--quick">
                    <div class="section-header">
                        <div>
                            <h3>Seleção rápida</h3>
                        </div>
                    </div>

                    <article class="quick-feature" th:if="${restauranteDestaque != null}">
                        <div class="quick-feature__media"
                             aria-hidden="true"
                             style="background-image: url('/img/tasca_local.png'); background-size: cover; background-position: center; background-repeat: no-repeat;"></div>
                        <div class="quick-feature__content">
                            <h3 th:text="${restauranteDestaque['nome']}">Tasca do Zé</h3>
                            <div class="pill-row">
                                <span class="pill" th:text="${restauranteDestaque['tipoRestaurante']}">PORTUGUES</span>
                                <span class="status-pill"
                                      th:classappend="${restauranteDestaque['estado'] == 'ABERTO'} ? ' status-pill--open' : ' status-pill--closed'"
                                      th:text="${restauranteDestaque['estado']}">ABERTO</span>
                            </div>
                            <div class="card__actions">
                                <a th:href="@{/restaurantes/{id}/produtos(id=${restauranteDestaque['id']})}">
                                    <button>Repetir pedido</button>
                                </a>
                            </div>
                        </div>
                    </article>
                </div>

                <section class="restaurants-highlight-section">
                    <div class="section-header">
                        <div>
                            <h3>Restaurantes em destaque</h3>
                        </div>
                    </div>

                    <div class="grid-restaurantes">
                        <article class="card" th:each="restaurante : ${restaurantes}">
                            <div class="card__image"
                                 aria-hidden="true"
                                 th:style="${'background-image: url(' + restaurante['imagePath'] + '); background-size: cover; background-position: center; background-repeat: no-repeat;'}"></div>

                            <div class="pill-row">
                                <span class="pill"
                                      th:text="${restaurante['tipoRestaurante'] != null ? restaurante['tipoRestaurante'] : restaurante['tipoCozinha']}">OUTRO</span>
                                <span class="status-pill"
                                      th:classappend="${restaurante['estado'] == 'ABERTO'} ? ' status-pill--open' : ' status-pill--closed'"
                                      th:text="${restaurante['estado']}">FECHADO</span>
                            </div>

                            <div>
                                <h3 th:text="${restaurante['nome']}">Restaurant Name</h3>
                                <p th:text="${restaurante['morada'] != null and restaurante['morada']['cidade'] != null ? restaurante['morada']['cidade'] : 'Localizacao por confirmar'}">Lisboa</p>
                            </div>

                            <div class="inline-pills">
                                <span class="tag">Menu direto</span>
                                <span class="pill">Entrada principal</span>
                            </div>

                            <div class="card__actions">
                                <a th:href="@{/restaurantes/{id}/produtos(id=${restaurante['id']})}">
                                    <button>Ver menu</button>
                                </a>
                            </div>
                        </article>
                    </div>
                </section>
            </section>
        </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: rodape}"></div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
