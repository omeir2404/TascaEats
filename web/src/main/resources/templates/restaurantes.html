<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurants - TascaEats</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: cabecalho}"></div>

    <main>
        <div th:replace="~{fragments/search-bar :: live-search}"></div>

        <div id="defaultViews">
            <h3>Your Favorites & Recents</h3>
            <div class="grid-restaurantes" style="margin-bottom: 40px;">
                <div class="card" style="background-color: #fff8f0; border-color: #ffcc99;">
                    <h3>Tasca do Zé</h3>
                    <p>⭐ 4.8 - Portuguese</p>
                    <p><em>You reviewed this recently!</em></p>
                    <a th:href="@{/restaurantes/1/produtos}"><button>Order Again</button></a>
                </div>
            </div>

            <h3>Featured Restaurants</h3>
            <div class="grid-restaurantes">
                <div class="card" th:each="restaurante : ${restaurantes}">
                    <h3 th:text="${restaurante.nome}">Restaurant Name</h3>
                    <p><strong>Cuisine:</strong> <span th:text="${restaurante.tipoCozinha}">Type</span></p>
                    <p><strong>Status:</strong> <span th:text="${restaurante.estado}">Open</span></p>
                    <br>
                    <a th:href="@{/restaurantes/{id}/produtos(id=${restaurante.id})}">
                        <button>View Menu</button>
                    </a>
                </div>
            </div>
        </div>

        <div id="liveGridContainer" style="display: none;">
            <h3>Search Results</h3>
            <div id="liveGridResults" class="grid-restaurantes">
                </div>
        </div>
        
    </main>

    <div th:replace="~{fragments/footer :: rodape}"></div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
