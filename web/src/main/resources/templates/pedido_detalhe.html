<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Details - TascaEats</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .order-container { max-width: 600px; margin: 40px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status-badge { padding: 8px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; display: inline-block; }
        .status-pending { background-color: #fff3cd; color: #856404; }
        .status-delivered { background-color: #d4edda; color: #155724; }
        .status-cancelled { background-color: #f8d7da; color: #721c24; }
        
        .review-box { background-color: #f8f9fa; border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-top: 30px; }
        .review-box textarea { width: 100%; height: 80px; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical;}
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: cabecalho}"></div>

    <main>
        <div class="order-container">
            <h2 th:text="'Order #' + ${pedido.id}">Order #1</h2>
            
            <p><strong>Restaurant:</strong> <span th:text="${pedido.restauranteNome}">Name</span></p>
            <p><strong>Date:</strong> <span th:text="${pedido.data}">Date</span></p>
            <p><strong>Total:</strong> <span th:text="${pedido.total} + '€'">0.00€</span></p>
            
            <hr style="margin: 20px 0;">

            <h3>Order Status</h3>
            <p>
                <span th:class="'status-badge ' + 
                    (${pedido.estado == 'PENDING'} ? 'status-pending' : 
                    (${pedido.estado == 'DELIVERED'} ? 'status-delivered' : 'status-cancelled'))"
                    th:text="${pedido.estado}">STATUS</span>
            </p>
            <p><strong>Assigned Courier:</strong> <span th:text="${pedido.entregador}">Name</span></p>

            <form th:if="${pedido.estado == 'PENDING'}" th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="POST" style="margin-top: 20px;">
                <button type="submit" style="background-color: #dc3545; color: white;" onclick="return confirm('Are you sure you want to cancel this order?');">Cancel Order</button>
            </form>

            <div th:if="${pedido.estado == 'DELIVERED' and !pedido.avaliado}" class="review-box">
                <h3 style="margin-top: 0;">Rate your experience</h3>
                <form th:action="@{/pedidos/{id}/avaliar(id=${pedido.id})}" method="POST">
                    
                    <label for="pontuacao">Rating (1 to 5 Stars):</label>
                    <select id="pontuacao" name="pontuacao" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;">
                        <option value="5">⭐⭐⭐⭐⭐ (Excellent)</option>
                        <option value="4">⭐⭐⭐⭐ (Good)</option>
                        <option value="3">⭐⭐⭐ (Average)</option>
                        <option value="2">⭐⭐ (Poor)</option>
                        <option value="1">⭐ (Terrible)</option>
                    </select>

                    <label for="comentario" style="display: block; margin-top: 15px;">Comments:</label>
                    <textarea id="comentario" name="comentario" placeholder="How was the food?"></textarea>

                    <button type="submit" style="width: 100%; margin-top: 15px;">Submit Review</button>
                </form>
            </div>

            <div th:if="${pedido.avaliado}" class="review-box" style="background-color: #e9ecef; text-align: center;">
                <p>✅ <em>Thank you! You have already reviewed this order.</em></p>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: rodape}"></div>
</body>
</html>
