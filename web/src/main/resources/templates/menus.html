<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Explore Menus - TascaEats</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .grid-menus {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .menu-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .menu-stats {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin: 15px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: cabecalho}"></div>

    <main>
        <h2>Explore Restaurant Menus</h2>

        <div class="filtro-container">
            <form th:action="@{/menus}" method="GET">
                
                <div class="form-group">
                    <label for="nome">Menu Name:</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Especial" th:value="${nome}">
                </div>

                <div class="form-group">
                    <label for="numeroProdutosMin">Min. Total Products:</label>
                    <input type="number" id="numeroProdutosMin" name="numeroProdutosMin" min="1" th:value="${numeroProdutosMin}">
                </div>

                <div class="form-group">
                    <label for="precoMedioMax">Max Average Price (€):</label>
                    <input type="number" id="precoMedioMax" name="precoMedioMax" step="0.50" min="0" th:value="${precoMedioMax}">
                </div>

                <button type="submit" style="display: none;">Filter Menus</button>
            </form>
        </div>

        <hr style="margin: 30px 0;">

        <div class="grid-menus">
            <div class="menu-card" th:each="menu : ${menus}">
                <div>
                    <h3 th:text="${menu.nome}" style="margin-top: 0; color: #ff6600;">Menu Name</h3>
                    <p style="color: #666; font-weight: bold;">📍 <span th:text="${menu.restauranteNome}">Restaurant</span></p>
                    
                    <div class="menu-stats">
                        <p style="margin: 5px 0;"><strong>Total Items:</strong> <span th:text="${menu.numeroProdutos}">0</span></p>
                        <p style="margin: 5px 0;"><strong>Average Price:</strong> <span th:text="${menu.precoMedio} + '€'">0.00€</span></p>
                    </div>
                </div>
                
                <a th:href="@{/restaurantes/{id}/produtos(id=${menu.restauranteId})}" style="text-decoration: none;">
                    <button style="width: 100%;">View Full Menu</button>
                </a>
            </div>
            
            <div th:if="${menus == null or menus.empty}" style="grid-column: 1 / -1; padding: 20px; text-align: center;">
                <p>No menus found matching these filters.</p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: rodape}"></div>
    
    <script th:src="@{/js/main.js}"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const filterForm = document.querySelector('.filtro-container form');
            if (!filterForm) return;

            let typingTimer;
            const textInputs = filterForm.querySelectorAll('input');
            
            textInputs.forEach(input => {
                input.addEventListener('input', () => {
                    clearTimeout(typingTimer);
                    typingTimer = setTimeout(() => filterForm.submit(), 600);
                });
            });
        });
    </script>
</body>
</html>
