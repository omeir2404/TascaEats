<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menus - TascaEats</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: cabecalho}"></div>

    <main class="page-shell page-shell--menus">
        <section class="page-intro">
            <h2>Explorar menus</h2>
        </section>

        <div th:if="${erro != null}" class="error-message page-error" th:text="${erro}">Erro ao carregar dados.</div>

        <section class="filtro-container">
            <form th:action="@{/menus}" method="GET">
                <div class="form-group form-group--wide">
                    <label for="nome">Nome do menu</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Especial" th:value="${nome}">
                </div>

                <div class="form-group form-group--medium">
                    <label for="numeroProdutosMin">Mínimo de produtos</label>
                    <input type="number" id="numeroProdutosMin" name="numeroProdutosMin" min="1" placeholder="Ex: 2" th:value="${numeroProdutosMin}">
                </div>

                <div class="form-group form-group--medium">
                    <label for="precoMedioMax">Preço médio max.</label>
                    <input type="number" id="precoMedioMax" name="precoMedioMax" step="0.50" min="0" th:value="${precoMedioMax}" placeholder="Ex: 15.00">
                </div>

                <div class="form-actions form-group--compact">
                    <button type="submit">Filtrar menus</button>
                </div>
            </form>
        </section>

        <div class="grid-menus">
            <article class="menu-card" th:each="menu : ${menus}">
                <!-- Use imagePath provided by the controller (robust to name changes) -->
                <img class="card__image" th:src="${menu.imagePath}" th:alt="${menu.nome}" alt="Menu image">

                <div class="pill-row">
                    <span class="tag">Menu</span>
                    <span class="pill" th:text="${menu.numeroProdutos} + ' produtos'">0 produtos</span>
                </div>

                <div>
                    <h3 th:text="${menu.nome}">Menu Name</h3>
                    <p th:text="${menu.restauranteNome}">Restaurant</p>
                </div>

                <div class="menu-stats">
                    <p><strong>Total:</strong>&nbsp;<span th:text="${menu.numeroProdutos}">0</span></p>
                    <p><strong>Preço médio:</strong>&nbsp;<span th:text="${menu.precoMedio} + ' €'">0.00 €</span></p>
                </div>

                <div class="menu-card__actions">
                    <a th:href="@{/restaurantes/{id}/produtos(id=${menu.restauranteId})}">
                        <button>Ver menu</button>
                    </a>
                </div>
            </article>

            <div class="empty-state" th:if="${menus == null or #lists.isEmpty(menus)}">
                <p>Não foram encontrados menus com estes filtros.</p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: rodape}"></div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
