<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="cabecalho" class="site-header">
        <div class="site-header__inner">
            <a th:href="@{/}" class="brand">
                <div class="brand-mark">TE</div>
                <div class="brand-copy">
                    <strong>TascaEats</strong>
                    <span>Restaurantes, menus e pedidos num fluxo mais limpo</span>
                </div>
            </a>

            <nav class="site-nav" aria-label="Navegacao principal">
                <a th:href="@{/restaurantes}">Restaurantes</a>
                <a th:href="@{/menus}">Menus</a>
                <a th:href="@{/utilizadores}">Utilizadores</a>
                <a th:href="@{/meus-pedidos}">Pedidos</a>
            </nav>

            <div class="header-actions">
                <th:block th:if="${session.loggedUser == null}">
                    <span class="header-badge">Fluxo unificado</span>
                    <a class="button-link secondary" th:href="@{/login}">Entrar</a>
                </th:block>

                <th:block th:if="${session.loggedUser != null}">
                    <div class="header-user">
                        <strong th:text="${session.loggedUser.nome}">Perfil</strong>
                        <span>Conta ativa</span>
                    </div>
                    <a class="button-link secondary"
                       th:href="@{/perfil/{id}(id=${session.loggedUser.id})}">Perfil</a>
                    <a class="button-link" th:href="@{/logout}">Sair</a>
                </th:block>
            </div>
        </div>
    </header>
</body>
</html>
