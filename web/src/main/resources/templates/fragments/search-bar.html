<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
    <div th:fragment="live-search" class="search-shell">
        <form th:action="@{/restaurantes/pesquisa}" method="GET" class="search-form-inline">
            <div class="search-input-wrap">
                <input type="text"
                       id="liveSearchInput"
                       name="nome"
                       placeholder="Pesquisar restaurante"
                       autocomplete="off">

                <div id="searchDropdown"
                     style="display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 1000; max-height: 320px; overflow-y: auto;"></div>
            </div>
            <a th:href="@{/restaurantes/pesquisa}" class="search-link">Filtros avançados</a>
            <button type="submit">Pesquisar</button>
        </form>
    </div>
</body>
</html>
